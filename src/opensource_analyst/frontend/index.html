<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenSource Analyst - Interactive Chat</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6;
    --green: #22c55e; --amber: #f59e0b; --red: #ef4444;
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  .header { padding: 12px 24px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
  .header h1 { font-size: 1.25rem; white-space: nowrap; }
  .header .badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; background: var(--accent); }
  .main { flex: 1; display: flex; overflow: hidden; }
  .panel { padding: 16px; overflow-y: auto; }
  .panel-left { width: 300px; border-right: 1px solid var(--border); background: var(--card); }
  .panel-center { flex: 1; display: flex; flex-direction: column; }
  .panel-right { width: 320px; border-left: 1px solid var(--border); background: var(--card); }
  h3 { font-size: 0.9rem; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .input-row input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); font-size: 0.9rem; }
  .input-row button, button { padding: 10px 20px; border: none; border-radius: var(--radius); background: var(--accent); color: #fff; cursor: pointer; font-size: 0.9rem; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: var(--border); }
  .status { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; }
  .status.ok { color: var(--green); }
  .status.error { color: var(--red); }
  .status.running { color: var(--amber); }
  .summary { font-size: 0.8rem; line-height: 1.5; }
  .summary details { margin-bottom: 8px; }
  .summary summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  .summary pre { font-size: 0.72rem; background: var(--bg); padding: 8px; border-radius: var(--radius); overflow-x: auto; white-space: pre-wrap; max-height: 200px; }
  .chat-area { flex: 1; overflow-y: auto; padding: 0 16px; }
  .chat-input { padding: 16px; border-top: 1px solid var(--border); }
  .chat-input textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); font-size: 0.9rem; resize: none; font-family: inherit; }
  .chat-input .row { display: flex; gap: 8px; margin-top: 8px; }
  .msg { margin-bottom: 20px; }
  .msg.user { text-align: right; }
  .msg.user .content { background: var(--accent); display: inline-block; text-align: left; max-width: 85%; }
  .msg.assistant .content { background: var(--card); border: 1px solid var(--border); max-width: 100%; }
  .msg .content { padding: 12px 16px; border-radius: var(--radius); font-size: 0.88rem; line-height: 1.6; }
  .msg .content p { margin-bottom: 8px; }
  .msg .content pre { background: var(--bg); padding: 12px; border-radius: 4px; overflow-x: auto; font-size: 0.8rem; }
  .msg .content code { font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 0.82rem; background: var(--bg); padding: 1px 4px; border-radius: 3px; }
  .msg .content pre code { background: none; padding: 0; }
  .msg .meta { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; }
  .trace-item { padding: 8px 12px; margin-bottom: 8px; border-radius: var(--radius); font-size: 0.78rem; }
  .trace-item.tool_call { background: rgba(59,130,246,0.15); border-left: 3px solid var(--accent); }
  .trace-item.observation { background: rgba(34,197,94,0.1); border-left: 3px solid var(--green); }
  .trace-item .trace-name { font-weight: 600; margin-bottom: 4px; }
  .trace-item .trace-args { font-size: 0.72rem; color: var(--muted); }
  .trace-item .trace-output { margin-top: 6px; padding: 6px 8px; background: var(--bg); border-radius: 4px; font-size: 0.72rem; max-height: 150px; overflow-y: auto; white-space: pre-wrap; }
  .loading { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; margin-left: 4px; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .empty-state { color: var(--muted); text-align: center; padding-top: 60px; font-size: 0.9rem; }
  .conv-id-display { font-size: 0.75rem; color: var(--muted); margin-left: auto; }
</style>
</head>
<body>
<div class="header">
  <h1>OpenSource Analyst</h1>
  <span class="badge">M13 ReAct</span>
  <span class="conv-id-display" id="convIdDisplay"></span>
</div>
<div class="main">
  <!-- Left Panel: Analysis Control -->
  <div class="panel panel-left">
    <h3>Repo Analysis</h3>
    <div class="input-row">
      <input id="repoUrl" placeholder="GitHub URL..." value="https://github.com/msiemens/tinydb">
      <button id="btnAnalyze" onclick="startAnalysis()">Analyze</button>
    </div>
    <div class="status" id="analysisStatus">Ready</div>
    <div class="summary" id="analysisSummary"></div>
  </div>

  <!-- Center Panel: Chat -->
  <div class="panel-center">
    <div class="chat-area" id="chatArea">
      <div class="empty-state">Input a GitHub URL and click Analyze to start.<br>Then ask questions about the codebase.</div>
    </div>
    <div class="chat-input">
      <textarea id="chatInput" rows="2" placeholder="Ask about the project..." disabled></textarea>
      <div class="row">
        <button id="btnSend" onclick="sendMessage()" disabled>Send</button>
        <button class="secondary" id="btnNewConv" onclick="resetAll()" style="display:none;">New Chat</button>
      </div>
    </div>
  </div>

  <!-- Right Panel: Reasoning Trace -->
  <div class="panel panel-right">
    <h3>Reasoning Trace</h3>
    <div id="traceArea">
      <div class="empty-state" style="padding-top:20px;font-size:0.8rem;">Tool calls and observations will appear here.</div>
    </div>
  </div>
</div>

<script>
mermaid.initialize({ startOnLoad: true, theme: 'dark' });

const API = '';
let state = { taskId: null, conversationId: null, repoUrl: null, analysisDone: false, streaming: false };

// ── Analysis ──────────────────────────────────
async function startAnalysis() {
  const url = document.getElementById('repoUrl').value.trim();
  if (!url) return;
  state.repoUrl = url;
  setStatus('Analyzing...', 'running');
  disableAnalyze(true);
  clearChat();
  clearTrace();

  try {
    const res = await fetch(API + '/analyze', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ repo_url: url })
    });
    if (!res.ok) { setStatus('Error: ' + (await res.json()).detail, 'error'); disableAnalyze(false); return; }
    const data = await res.json();
    state.taskId = data.task_id;
    setStatus('Task: ' + state.taskId + ' — polling...', 'running');
    pollTask();
  } catch (e) { setStatus('Error: ' + e.message, 'error'); disableAnalyze(false); }
}

async function pollTask() {
  const maxRetries = 120;
  for (let i = 0; i < maxRetries; i++) {
    await sleep(2000);
    const res = await fetch(API + '/task/' + state.taskId);
    if (!res.ok) continue;
    const data = await res.json();
    setStatus('Status: ' + data.status + (i > 0 ? ` (${i * 2}s)` : ''), data.status === 'completed' ? 'ok' : 'running');
    if (data.status === 'completed') {
      state.analysisDone = true;
      await loadResult();
      await startConversation();
      return;
    }
    if (data.status === 'error') { setStatus('Analysis failed', 'error'); disableAnalyze(false); return; }
  }
  setStatus('Timeout — try again', 'error'); disableAnalyze(false);
}

async function loadResult() {
  const res = await fetch(API + '/task/' + state.taskId + '/result');
  if (!res.ok) return;
  const data = await res.json();
  console.log('Raw API response:', data);
  // TaskResult 模型: {task_id, status, result: {overview, ...}, error}
  const analysisData = data.result || data;
  console.log('Analysis data:', analysisData);
  renderSummary(analysisData);
}

function renderSummary(data) {
  const el = document.getElementById('analysisSummary');
  let html = '';
  if (data.overview) {
    html += '<details open><summary>Overview</summary><pre>' + escJson(data.overview) + '</pre></details>';
  }
  if (data.tech_stack) {
    html += '<details><summary>Tech Stack</summary><pre>' + escJson(data.tech_stack) + '</pre></details>';
    // Show dependencies if present within tech_stack
    if (data.tech_stack.key_dependencies && data.tech_stack.key_dependencies.length > 0) {
      html += '<details><summary>Dependencies</summary><pre>' + escJson(data.tech_stack.key_dependencies) + '</pre></details>';
    }
  }
  if (data.architecture) html += '<details><summary>Architecture</summary><pre>' + escJson(data.architecture) + '</pre></details>';
  if (data.learning_path) html += '<details><summary>Learning Path</summary><pre>' + escJson(data.learning_path) + '</pre></details>';
  if (data.interview_result) html += '<details><summary>Interview Questions</summary><pre>' + escJson(data.interview_result) + '</pre></details>';
  if (data.reflection) html += '<details><summary>Reflection</summary><pre>' + escJson(data.reflection) + '</pre></details>';
  if (data.mermaid_diagrams) {
    html += '<details><summary>Mermaid Diagrams</summary>';
    for (const [k, v] of Object.entries(data.mermaid_diagrams)) {
      if (v) html += '<pre class="mermaid">' + escHtml(v) + '</pre>';
    }
    html += '</details>';
    setTimeout(() => mermaid.run({ querySelector: '.mermaid' }), 100);
  }
  if (!html) {
    html = '<p style="color: var(--muted);">No analysis data available.</p>';
  }
  el.innerHTML = html;
}

async function startConversation() {
  try {
    const res = await fetch(API + '/conversation/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task_id: state.taskId })
    });
    if (!res.ok) { setStatus('Failed to start conversation', 'error'); return; }
    const data = await res.json();
    state.conversationId = data.conversation_id;
    document.getElementById('convIdDisplay').textContent = 'Conv: ' + state.conversationId;
    document.getElementById('btnNewConv').style.display = '';
    enableChat(true);
    setStatus('Ready — ask a question below!', 'ok');
    addSystemMsg('Analysis complete. You can now ask questions about **' + state.repoUrl + '**.');
  } catch (e) { setStatus('Error: ' + e.message, 'error'); }
}

// ── Chat ──────────────────────────────────────
async function sendMessage() {
  if (state.streaming) return;
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg || !state.conversationId) return;
  input.value = '';
  state.streaming = true;
  document.getElementById('btnSend').disabled = true;

  addUserMsg(msg);
  clearTrace();

  try {
    const res = await fetch(API + '/conversation/' + state.conversationId + '/message', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    });
    if (!res.ok) { addErrorMsg('Error: ' + (await res.json()).detail); return; }
    const data = await res.json();
    addAssistantMsg(data.assistant_response);
    for (const step of (data.reasoning_steps || [])) {
      addTraceItem(step);
    }
  } catch (e) { addErrorMsg('Error: ' + e.message); }
  finally {
    state.streaming = false;
    document.getElementById('btnSend').disabled = false;
    document.getElementById('chatInput').focus();
  }
}

// ── UI Helpers ────────────────────────────────
function addUserMsg(text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div'); div.className = 'msg user';
  div.innerHTML = '<div class="content">' + escHtml(text) + '</div>';
  area.appendChild(div); area.scrollTop = area.scrollHeight;
}

function addAssistantMsg(text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div'); div.className = 'msg assistant';
  div.innerHTML = '<div class="content">' + marked.parse(text) + '</div>';
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  // Render mermaid blocks
  setTimeout(() => {
    document.querySelectorAll('.msg.assistant .content pre code.language-mermaid').forEach(el => {
      const pre = el.parentElement;
      pre.classList.add('mermaid');
      pre.textContent = el.textContent;
    });
    mermaid.run({ querySelector: '.mermaid' });
  }, 100);
}

function addSystemMsg(text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div'); div.className = 'msg assistant';
  div.innerHTML = '<div class="content" style="border-color: var(--green); border-left: 3px solid var(--green);">' + marked.parse(text) + '</div>';
  area.appendChild(div); area.scrollTop = area.scrollHeight;
}

function addErrorMsg(text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div'); div.className = 'msg assistant';
  div.innerHTML = '<div class="content" style="border-color: var(--red); color: var(--red);">' + escHtml(text) + '</div>';
  area.appendChild(div); area.scrollTop = area.scrollHeight;
}

function addTraceItem(step) {
  const area = document.getElementById('traceArea');
  if (area.querySelector('.empty-state')) area.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'trace-item ' + step.step_type;
  let html = '<div class="trace-name">' + (step.step_type === 'tool_call' ? 'Action' : 'Observation');
  if (step.tool_name) html += ': ' + step.tool_name;
  html += '</div>';
  if (step.tool_args) html += '<div class="trace-args">Args: ' + escJson(step.tool_args) + '</div>';
  if (step.step_type === 'observation' && step.content) {
    html += '<div class="trace-output">' + escHtml(step.content) + '</div>';
  }
  div.innerHTML = html;
  area.appendChild(div); area.scrollTop = area.scrollHeight;
}

function clearChat() {
  document.getElementById('chatArea').innerHTML = '<div class="empty-state">Analysis running... once complete, start chatting.</div>';
}
function clearTrace() {
  document.getElementById('traceArea').innerHTML = '<div class="empty-state" style="padding-top:20px;font-size:0.8rem;">Tool calls and observations will appear here.</div>';
}
function setStatus(text, cls) {
  const el = document.getElementById('analysisStatus');
  el.textContent = text; el.className = 'status ' + cls;
}
function enableChat(on) {
  document.getElementById('chatInput').disabled = !on;
  document.getElementById('btnSend').disabled = !on;
}
function disableAnalyze(on) { document.getElementById('btnAnalyze').disabled = on; }
function resetAll() {
  state = { taskId: null, conversationId: null, repoUrl: null, analysisDone: false };
  document.getElementById('convIdDisplay').textContent = '';
  document.getElementById('btnNewConv').style.display = 'none';
  document.getElementById('analysisSummary').innerHTML = '';
  document.getElementById('analysisStatus').textContent = 'Ready';
  document.getElementById('analysisStatus').className = 'status';
  disableAnalyze(false); enableChat(false);
  clearChat(); clearTrace();
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function escHtml(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}
function escJson(obj) { return escHtml(JSON.stringify(obj, null, 2)); }

// Enter to send, Shift+Enter for newline
document.getElementById('chatInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
</script>
</body>
</html>
